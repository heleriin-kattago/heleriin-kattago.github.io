<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heleriin Kattago | Logos &amp; Brand Design</title>

  <link rel="icon" type="image/png" href="1/landing%20and%20loading%20page/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css-v2/style-v2.css">

  <style>
    /* ── rolling star, like the old page ── */
    :root {
      --star-duration: 14s;
      --star-size: min(42vw, 400px);
    }

    .star-stage {
      position: relative;
      width: 100%;
      height: 160px;
      overflow: visible;
      margin: 1.25rem auto 1rem;
    }

    .star-roller {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: var(--star-size);
      height: auto;
      will-change: transform;
      pointer-events: none;
      animation: rollLeft var(--star-duration) cubic-bezier(.33, .01, .67, .99) infinite;
    }

    @keyframes rollLeft {
      from { transform: translate(110vw, -50%) rotate(0turn); }
      to   { transform: translate(-110vw, -50%) rotate(-2.2turn); }
    }

    @media (prefers-reduced-motion: reduce) {
      .star-roller { animation: none; left: 50%; transform: translate(-50%, -50%); }
    }

    /* ── logo gallery ── */
    .logo-gallery {
      display: flex;
      flex-direction: column;
      gap: 3rem;
      max-width: 900px;
      margin: 2rem auto;
    }

    .logo-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .logo-row img {
      max-width: 100%;
      height: auto;
      max-height: 260px;
    }

    .logo-caption {
      font-size: 20px;
      letter-spacing: 0.08em;
      margin-top: 0.25rem;
      color: #101A04;
    }

    .logo-caption a {
      color: #536340;
    }

    /* ── Casa Granado feature (brand colors kept) ── */
    .casa-section {
      background: #F1E4E6;
      border: 1px solid #722330;
      padding: 3rem 2rem;
      margin: 3rem auto;
      max-width: 1000px;
      text-align: left;
    }

    .casa-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    .casa-title {
      font-weight: normal;
      font-size: 32px;
      letter-spacing: 0.06em;
      color: #722330;
    }

    .casa-emoji { width: 40px; height: auto; }

    .casa-main-image {
      max-width: 520px;
      width: 100%;
      margin: 0 auto;
      display: block;
    }

    /* ── Mamm strip (brand colors kept) ── */
    .mamm-section {
      background: #722330;
      border: 1px solid #722330;
      padding: 4rem 2rem;
      margin: 3rem auto;
      max-width: 1000px;
      min-height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mamm-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 3rem;
      flex-wrap: wrap;
    }

    .mamm-row img { max-height: 250px; }
    .mamm-small { max-height: 125px !important; }

    @media (max-width: 768px) {
      .star-stage { height: 200px; }
      .star-roller { width: min(60vw, 440px); }
      .logo-row img { max-height: 220px; }
      .casa-title { font-size: 26px; }
      .mamm-section { padding: 3rem 1rem; min-height: 220px; }
      .mamm-row { gap: 1.5rem; }
      .mamm-row img { max-height: 170px; }
      .mamm-small { max-height: 95px !important; }
    }
  </style>
</head>

<body class="subpage" data-title-key="title.logos">

  <button id="langToggle" class="lang-toggle" data-i18n="lang.switch">EST</button>

  <nav class="top-nav">
    <a href="shop.html" class="nav-box" data-i18n="nav.shop">shop</a>
    <a href="index-v2.html" class="nav-box" data-i18n="nav.home">home</a>
    <a href="index-v2.html" class="name-link"><img src="1/landing%20and%20loading%20page/heleriinkattago.svg" alt="Heleriin Kattago" class="name-logo"></a>
    <a href="about.html" class="nav-box" data-i18n="nav.about">about</a>
    <a href="contact.html" class="nav-box" data-i18n="nav.contact">contact</a>
  </nav>

  <main>
    <h1 class="page-title" data-i18n="logos.title">Logos &amp; Brand Design</h1>

    <!-- rolling star -->
    <div class="star-stage" aria-hidden="true">
      <img src="1/landing%20and%20loading%20page/star-roll.png" alt="" class="star-roller">
    </div>

    <div class="logo-gallery">
      <!-- Loovkaaren -->
      <div class="logo-row">
        <img src="logos/loovkaaren.svg" alt="Loovkaaren logo (SVG)">
        <a href="https://loovkaaren.eu/" target="_blank" rel="noopener">
          <img src="logos/loovkaaren.png" alt="Loovkaaren logo (PNG)">
        </a>
        <div class="logo-caption">
          <a href="https://loovkaaren.eu/" target="_blank" rel="noopener" data-i18n="logos.loovkaaren">Logo and font for Loovkaaren</a>
        </div>
      </div>

      <!-- Casa Granado logo -->
      <div class="logo-row">
        <img src="logos/casagranado.png" alt="Casa Granado logo">
        <div class="logo-caption" data-i18n="logos.casa">Logo for Casa Granado</div>
      </div>
    </div>

    <!-- Casa Granado feature -->
    <div class="casa-section">
      <div class="casa-header">
        <h2 class="casa-title">Casa Granado</h2>
        <img src="logos/minimamm.png" alt="Mini Mamm" class="casa-emoji">
      </div>
      <img src="logos/casa.png" alt="Casa Granado brand design" class="casa-main-image">
    </div>

    <!-- Mamm strip -->
    <div class="mamm-section">
      <div class="mamm-row">
        <img src="logos/cB.png" alt="Mamm logo, dark version">
        <img src="logos/mamm.png" alt="Mamm logo" class="mamm-small">
        <img src="logos/cW.png" alt="Mamm logo, light version">
      </div>
    </div>

    <div class="button-row">
      <a href="index-v2.html#projects" class="page-button" data-i18n="back">Back</a>
    </div>
  </main>

  <script src="js-v2/translations.js"></script>
  <script src="js-v2/script-v2.js"></script>
  <script>
    // pause the rolling star when it's off-screen
    if ('IntersectionObserver' in window) {
      const stage = document.querySelector('.star-stage');
      const star = document.querySelector('.star-roller');
      if (stage && star) {
        const io = new IntersectionObserver(entries => {
          star.style.animationPlayState = entries[0].isIntersecting ? 'running' : 'paused';
        }, { threshold: 0.1 });
        io.observe(stage);
      }
    }
  </script>
</body>
</html>
