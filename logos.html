<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heleriin Kattago | Logos</title>
    <link rel="icon" type="image/png" href="pics/favicongreen.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inknut+Antiqua:wght@400;700&family=Jomolhari&family=Mansalva&display=swap">
    <style>
        :root {
            --white: #F6F6F6;
            --dark-green: #101A04;
            --medium-green: #536340;
            --pink-bg: #F1E4E6;
            --dark-pink: #722330; /* Updated dark pink color */
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: url('pics/cursor.svg'), auto;
        }
        
        body {
            font-family: 'Mansalva', cursive;
            background-color: var(--white);
            color: var(--dark-green);
            padding: 2rem;
            text-align: center;
        }
        
        h1 {
            font-size: 64px;
            margin-bottom: 2rem;
        }
        
        .main-logo {
            width: 600px;
            height: auto;
            margin: 2rem auto;
            display: block;
        }
        
        .logo-gallery {
            display: flex;
            flex-direction: column;
            gap: 3rem;
            max-width: 800px;
            margin: 3rem auto;
        }
        
        .logo-row {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }
        
        .logo-row img {
            max-width: 100%;
            height: auto;
            max-height: 400px;
            border-radius: 8px;
        }
        
        .logo-caption {
            font-size: 24px;
            margin-top: 0.5rem;
        }

        /* clickable caption styling */
        .logo-caption a {
            color: inherit;
            text-decoration: none;
        }
        .logo-caption a:hover {
            text-decoration: underline;
        }
        
        /* Casa Granado Section */
        .casa-section {
            background-color: var(--pink-bg);
            padding: 3rem 2rem;
            border-radius: 12px;
            margin: 2rem 0;
            text-align: left;
        }
        
        .casa-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        
        .casa-title {
            font-family: 'Jomolhari', serif;
            font-size: 32px;
            color: var(--dark-pink);
        }
        
        .casa-emoji {
            width: 40px;
            height: auto;
        }
        
        .casa-main-image {
            max-width: 500px;
            margin: 0 auto;
            display: block;
        }
        
        .casa-description {
            font-size: 18px;
            line-height: 1.6;
            margin-top: 1.5rem;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }
        
        /* Mamm Section */
        .mamm-section {
            background-color: var(--dark-pink);
            padding: 4rem 2rem;
            border-radius: 12px;
            margin: 3rem 0;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .mamm-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 3rem;
        }
        
        .mamm-row img {
            max-height: 250px;
        }
        
        .mamm-small {
            max-height: 125px !important;
        }
        
        .back-link {
            display: inline-block;
            margin-top: 3rem;
            font-size: 24px;
            color: var(--medium-green);
            text-decoration: none;
            border: 2px solid var(--medium-green);
            padding: 0.5rem 1.5rem;
            border-radius: 4px;
            transition: all 0.3s ease;
        }
        
        .back-link:hover {
            background-color: var(--medium-green);
            color: var(--white);
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 48px;
            }
            
            .main-logo {
                width: 100%;
                max-width: 100px;
            }
            
            .logo-row img {
                max-height: 100px;
            }
            
            .casa-title {
                font-size: 28px;
            }
            
            .casa-emoji {
                width: 30px;
            }
            
            .casa-main-image {
                max-width: 100%;
            }
            
            .mamm-row {
                flex-direction: column;
                gap: 1.5rem;
            }
            
            .mamm-section {
                padding: 3rem 1rem;
                min-height: 200px;
            }
        }
    </style>
</head>
<body>
    <h1>Logos</h1>
    
    <img src="logos/star1.svg" alt="Star Logo" class="main-logo">
    
    <div class="logo-gallery">
        <!-- Loovkaaren first -->
        <div class="logo-row">
            <!-- SVG (not clickable) -->
            <img src="logos/loovkaaren.svg" alt="Loovkaaren Logo (SVG)" class="logo-svg">

            <!-- PNG clickable -->
            <a href="https://loovkaaren.eu/" target="_blank" rel="noopener">
                <img src="logos/loovkaaren.png" alt="Loovkaaren Logo (PNG)" class="logo-png">
            </a>

            <!-- Caption clickable -->
            <div class="logo-caption">
                <a href="https://loovkaaren.eu/" target="_blank" rel="noopener">Logo and font for Loovkaaren</a>
            </div>
        </div>

        <div class="logo-row">
            <img src="logos/casagranado.png" alt="Casa Granado Logo">
            <div class="logo-caption">Logo for Casa Granado</div>
        </div>
    </div>
    
    <!-- Casa Granado Pink Section -->
    <div class="casa-section">
        <div class="casa-header">
            <h2 class="casa-title"></h2>
            <img src="logos/minimamm.png" alt="Mini Mamm" class="casa-emoji">
        </div>
        
        <img src="logos/casa.png" alt="Casa H964" class="casa-main-image">
        
        <p class="logo-caption"></p>
        
        <p class="casa-description">
           
    </div>
    
    <!-- Expanded Dark Pink Mamm Section -->
    <div class="mamm-section">
        <div class="mamm-row">
            <img src="logos/cB.png" alt="cB Logo">
            <img src="logos/mamm.png" alt="Mamm Logo" class="mamm-small">
            <img src="logos/cW.png" alt="cW Logo">
        </div>
    </div>
    
    <a href="index.html" class="back-link">Back</a>
</body>
</html>
