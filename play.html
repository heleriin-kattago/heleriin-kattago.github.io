<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Arsenal Quest</title>

<!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="pics/starfav.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inknut+Antiqua:wght@400;700&family=Jomolhari&family=Mansalva&display=swap" rel="stylesheet">
<style>
html, body, a, button { cursor: url('pics/cursor.svg'), auto; }
:root{ --gap:14px; --dark:#101A04; --mid:#536340; --accent:#722330; --paper:#f9f9f9; }
*{ box-sizing:border-box }
body{ font-family:'Inknut Antiqua',serif; text-align:center; background:var(--paper); margin:0; color:var(--dark) }
h1,h2,h3{ font-family:'Mansalva',cursive; margin:0 }
section{ margin:40px auto; max-width:960px; padding:0 18px }

/* Big overlay lines */
#overlay{ position:fixed; inset:0; background:var(--paper); z-index:50; display:none }
.overlayLine{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  text-align:center; padding:0 16px; font-family:'Mansalva',cursive;
  font-size:clamp(26px,5.2vw,56px); line-height:1.1;
  opacity:0; transform:translateY(10px);
  transition:opacity .6s ease, transform .6s ease;
}
.overlayLine.show{ opacity:1; transform:translateY(0) }
.overlayLine.hide{ opacity:0; transform:translateY(-10px) }

/* Continue hint */
#tapHint{
  position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
  background:rgba(0,0,0,.78); color:#fff; padding:8px 12px; border-radius:10px;
  font-size:14px; opacity:0; pointer-events:none; transition:opacity .25s ease; z-index:60;
}
#tapHint.show{ opacity:1 }
@media (max-width: 600px){
  #tapHint{ font-size:12px; bottom:16px; }
}

/* Small story status line */
#storyWrap{ position:relative; min-height:90px; margin:22px auto 10px }
#story{
  margin:10px 0 6px; font-family:'Jomolhari',serif;
  font-size:clamp(20px,2.8vw,26px); line-height:1.45;
}
#story.compact{ transform:translateY(-6px); opacity:.95; font-size:clamp(18px,2.3vw,22px) }
#story.mansalva{ font-family:'Mansalva',cursive }

/* Arsenal */
#arsenalSection{ display:none }
#arsenalSection h2{ font-family:'Inknut Antiqua',serif }
#arsenalGrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:18px; margin-top:10px }
.asset{ position:relative; background:transparent; border:none; outline:none; padding:10px; cursor:pointer; transition:transform .12s ease }
.asset:focus-visible{ outline:2px solid var(--mid); border-radius:12px }
.asset:hover{ transform:translateY(-2px) scale(1.02) }
.asset img.thumb{ display:block; width:120px; height:120px; margin:0 auto; object-fit:contain; border:none; background:transparent }
.asset.selected::after{ content:""; position:absolute; inset:-6px; border-radius:14px; outline:3px solid var(--mid) }
#arsenalBlurbs{ margin-top:12px; text-align:left; max-width:800px; margin-inline:auto; display:none }
#arsenalBlurbs .blurb{ margin:8px 0; font-family:'Jomolhari',serif; font-size:16px; line-height:1.5 }
#arsenalBlurbs .blurb b{ font-family:'Inknut Antiqua',serif; font-weight:700 }

/* Cup shuffle */
#cupStage{ display:none; margin:26px auto 0; max-width:960px }
#board{ position:relative; height:360px; margin-top:6px }
#cupRow{ position:relative; height:260px; margin-top:10px }
.cup{
  position:absolute; width:160px; height:160px; top:60px; border:none;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  transition:left 1s ease, transform .28s ease;
}
.cup img{ width:160px; height:160px; object-fit:contain; border:none; display:block }
[data-pos="0"]{ left:80px }
[data-pos="1"]{ left:calc(50% - 80px) }
[data-pos="2"]{ left:calc(100% - 240px) }
#flyingItem{
  position:absolute; width:120px; height:120px; object-fit:contain; border:none; pointer-events:none;
  left:calc(50% - 60px); top:170px; opacity:0; transform:scale(.9);
  transition:left .6s ease, top .6s ease, opacity .35s ease, transform .6s ease; z-index:3;
}
.popItem{
  position:absolute; width:120px; height:120px; object-fit:contain; border:none; pointer-events:none;
  opacity:0; transform:translateY(0) scale(.1); transition:opacity .35s ease, transform .55s ease; z-index:4;
}

/* Results buttons */
#resultBtns{ display:none; margin:26px auto 0; max-width:960px }
#resultBtns .row{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center }
.btn{
  padding:14px 22px; border:1px solid #333; background:#fff; border-radius:12px;
  font-family:'Mansalva',cursive; cursor:pointer; transition:.2s; font-size:20px; min-width:220px;
}
.btn:hover{ background:#333; color:#fff }
@media (max-width:600px){ .btn{ width:100% } }

/* Back to portfolio */
#backPortfolio{
  display:none; margin:16px auto 40px; text-decoration:none; color:#333;
  border:1px solid #333; border-radius:10px; padding:10px 16px;
  font-family:'Mansalva',cursive; font-size:18px;
}
#backPortfolio.show{ display:inline-block }
#backPortfolio:hover{ background:#333; color:#fff }

/* iPhone spacing */
@media (max-width: 430px){
  #board{ height: 360px; }
  #cupRow{ height: 260px; }
  .cup{ width:130px; height:130px; top:70px; }
  .cup img{ width:130px; height:130px; }
  [data-pos="0"]{ left:12px; }
  [data-pos="1"]{ left:calc(50% - 65px); }
  [data-pos="2"]{ left:calc(100% - 142px); }
  #flyingItem{ width:100px; height:100px; top:185px; left:calc(50% - 50px); }
  .popItem{ width:100px; height:100px; }
}
@media (max-width: 360px){
  .cup{ width:110px; height:110px; top:74px; }
  .cup img{ width:110px; height:110px; }
  [data-pos="0"]{ left:8px; }
  [data-pos="1"]{ left:calc(50% - 55px); }
  [data-pos="2"]{ left:calc(100% - 118px) }
  #flyingItem{ width:90px; height:90px; top:190px; left:calc(50% - 45px); }
  .popItem{ width:90px; height:90px; }
}

/* Audio note + control */
#audioNote{
  position:fixed; left:50%; bottom:18px; transform:translateX(-50%);
  background:#ffffff; border:1px solid rgba(0,0,0,.25); border-radius:12px;
  padding:8px 12px; font-size:14px; z-index:70; box-shadow:0 2px 8px rgba(0,0,0,.06);
  opacity:0; pointer-events:none; transition:opacity .25s ease;
}
#audioNote.show{ opacity:1; pointer-events:auto }
#soundBtn{
  position:fixed; right:12px; top:12px; z-index:70; width:36px; height:36px;
  display:flex; align-items:center; justify-content:center; border:1px solid rgba(0,0,0,.35);
  background:#fff; border-radius:50%; font-size:18px; cursor:pointer;
}
#soundBtn:hover{ background:#333; color:#fff }
</style>
</head>
<body>

<!-- Music -->
<audio id="bgm" preload="auto" loop></audio>

<!-- Audio note + sound control -->
<div id="audioNote">Playing <i>“Fight the Dragon”</i> — by me. Turn up the volume of your device.</div>
<button id="soundBtn" title="Sound: normal" aria-label="Sound: normal">🔊</button>

<div id="overlay"></div>
<div id="tapHint">Click or press space to continue</div>

<section id="storySection"><div id="storyWrap"><div id="story"></div></div></section>

<section id="arsenalSection">
  <h2>Choose from your Arsenal</h2>
  <div id="arsenalGrid" aria-label="Arsenal">
    <button class="asset" data-item="sword"><img class="thumb" src="play/SWORD.svg"></button>
    <button class="asset" data-item="gun"><img class="thumb" src="play/REVOLVER.svg"></button>
    <button class="asset" data-item="holy"><img class="thumb" src="play/HOLY-WATER-GUN.svg"></button>
    <button class="asset" data-item="heart"><img class="thumb" src="play/HEART.svg"></button>
    <button class="asset" data-item="socks"><img class="thumb" src="play/SOCKS.svg"></button>
    <button class="asset" data-item="rose"><img class="thumb" src="play/ROSE.svg"></button>
  </div>
</section>

<section id="cupStage">
  <h2 id="cupTitle">The Shuffle</h2>
  <div id="board">
    <div id="cupRow">
      <img id="flyingItem">
      <div id="cup0" class="cup" data-pos="0"><img src="play/CUP.svg"></div>
      <div id="cup1" class="cup" data-pos="1"><img src="play/CUP.svg"></div>
      <div id="cup2" class="cup" data-pos="2"><img src="play/CUP.svg"></div>
    </div>
  </div>
</section>

<section id="resultBtns">
  <div class="row">
    <button id="again" class="btn">Replay current story</button>
    <button id="toDragon" class="btn">📑 Bureaucratic Dragon</button>
    <button id="toLibrary" class="btn">🌊 Flooded Library</button>
  </div>
</section>

<a id="backPortfolio" href="index.html">Back to portfolio</a>

<script>
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const overlay=$('#overlay'), tapHint=$('#tapHint');

/* Audio setup */
const bgm=$('#bgm'); bgm.src=encodeURI('play/Fire to dragon .mp3');
let soundMode='normal'; const soundBtn=$('#soundBtn'); const audioNote=$('#audioNote');
function applySoundMode(){
  if(soundMode==='normal'){ bgm.muted=false; bgm.volume=0.7; soundBtn.textContent='🔊'; }
  if(soundMode==='quiet'){  bgm.muted=false; bgm.volume=0.2; soundBtn.textContent='🔉'; }
  if(soundMode==='muted'){  bgm.muted=true;  soundBtn.textContent='🔇'; }
}
soundBtn.onclick=()=>{ soundMode=(soundMode==='normal')?'quiet':(soundMode==='quiet'?'muted':'normal'); applySoundMode(); };

/* Overlay lines */
let overlayAdvances=0; const isMobile=()=>window.matchMedia('(max-width:600px)').matches;
async function playLines(lines,{onAdvance=null}={}){
  overlay.innerHTML=''; overlay.style.display='block';
  for(let i=0;i<lines.length;i++){
    const el=document.createElement('div'); el.className='overlayLine'; el.innerHTML=lines[i]; overlay.appendChild(el);
    await wait(30); el.classList.add('show'); await wait(350);
    if(!(isMobile()&&overlayAdvances>=2)) tapHint.classList.add('show');
    await new Promise(res=>{ const h=e=>{if(e.type==='keydown'&&e.code!=='Space')return;cleanup();res();};
      function cleanup(){overlay.removeEventListener('click',h);document.removeEventListener('keydown',h);}
      overlay.addEventListener('click',h);document.addEventListener('keydown',h);});
    overlayAdvances++; tapHint.classList.remove('show'); if(onAdvance) onAdvance(i);
    el.classList.add('hide'); await wait(420);
  } overlay.style.display='none';
}

/* Intro text */
const INTRO_FIXED="My dear Traveller… the path before you darkens. A challenge rises from the shadows, heavy and uncertain.";
const INTRO_VARIANTS=[
  "Yet take heart—within your grasp lies an Arsenal, forged not of chance but of choice.<br>Each piece within it is a key, and with the right one, you shall shape fate itself and turn peril into triumph.",
  "Yet despair not—for you are not defenceless. You carry with you an Arsenal, a collection of strange and wondrous tools, each humming with its own secret power.<br>They are not mere trinkets, but echoes of choices past and keys to choices yet to come.",
  "The challenge rises before you, vast and unyielding. But you, Traveller, are more than a wanderer—you are a weaver of fate.<br>Reach into your Arsenal, and decide: how will you meet the storm?"
];

/* Run intro */
async function runScenarioIntro(key){
  overlayAdvances=0;
  const variant=INTRO_VARIANTS[Math.floor(Math.random()*INTRO_VARIANTS.length)];
  await playLines(["Welcome, let’s play a game, shall we?"],{
    onAdvance:()=>{ bgm.play().then(()=>{applySoundMode();audioNote.classList.add('show');setTimeout(()=>audioNote.classList.remove('show'),3500);}); }
  });
  await playLines([INTRO_FIXED,variant]);
  // then scenario-specific lines … (same as before)
}
applySoundMode(); runScenarioIntro('kitchen');
</script>
</body>
</html>
