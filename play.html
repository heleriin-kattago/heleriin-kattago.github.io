<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Arsenal Quest</title>
<link rel="icon" type="image/svg+xml" href="pics/starfav.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inknut+Antiqua:wght@400;700&family=Jomolhari&family=Mansalva&display=swap" rel="stylesheet">
<style>
html, body, a, button { cursor: url('pics/cursor.svg'), auto; }
:root{ --gap:14px; --dark:#101A04; --mid:#536340; --paper:#f9f9f9; }
*{ box-sizing:border-box }
body{ font-family:'Inknut Antiqua',serif; text-align:center; background:var(--paper); margin:0; color:var(--dark) }
h1,h2,h3{ font-family:'Mansalva',cursive; margin:0 }
section{ margin:40px auto; max-width:960px; padding:0 18px }

/* Overlay lines */
#overlay{ position:fixed; inset:0; background:var(--paper); z-index:50; display:none }
.overlayLine{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:0 16px;
  font-family:'Mansalva',cursive; font-size:clamp(26px,5.2vw,56px); line-height:1.1;
  opacity:0; transform:translateY(10px); transition:opacity .6s ease, transform .6s ease; }
.overlayLine.show{ opacity:1; transform:translateY(0) }
.overlayLine.hide{ opacity:0; transform:translateY(-10px) }

/* Continue hint */
#tapHint{ position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:rgba(0,0,0,.78); color:#fff;
  padding:8px 12px; border-radius:10px; font-size:14px; opacity:0; pointer-events:none; transition:opacity .25s ease; z-index:60; }
#tapHint.show{ opacity:1 }
@media (max-width: 600px){ #tapHint{ font-size:12px; bottom:16px; } }

/* Status line */
#storyWrap{ position:relative; min-height:90px; margin:22px auto 10px }
#story{ margin:10px 0 6px; font-family:'Jomolhari',serif; font-size:clamp(20px,2.8vw,26px); line-height:1.45; }
#story.compact{ transform:translateY(-6px); opacity:.95; font-size:clamp(18px,2.3vw,22px) }
#story.mansalva{ font-family:'Mansalva',cursive }

/* Arsenal */
#arsenalSection{ display:none }
#arsenalSection h2{ font-family:'Inknut Antiqua',serif }
#arsenalGrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:18px; margin-top:10px }
.asset{ position:relative; background:transparent; border:none; outline:none; padding:10px; cursor:pointer; transition:transform .12s ease }
.asset:hover{ transform:translateY(-2px) scale(1.02) }

/* Cup shuffle */
#cupStage{ display:none; margin:26px auto 0; max-width:960px }
#board{ position:relative; height:360px; margin-top:6px }
#cupRow{ position:relative; height:260px; margin-top:10px }
.cup{ position:absolute; width:160px; height:160px; top:60px; border:none; display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:left 1s ease, transform .28s ease; }
.cup img{ width:160px; height:160px; object-fit:contain }
[data-pos="0"]{ left:80px } [data-pos="1"]{ left:calc(50% - 80px) } [data-pos="2"]{ left:calc(100% - 240px) }
#flyingItem{ position:absolute; width:120px; height:120px; object-fit:contain; left:calc(50% - 60px); top:170px; opacity:0;
  transform:scale(.9); transition:left .6s ease, top .6s ease, opacity .35s ease, transform .6s ease; z-index:3; }
.popItem{ position:absolute; width:120px; height:120px; object-fit:contain; opacity:0; transform:translateY(0) scale(.1);
  transition:opacity .35s ease, transform .55s ease; z-index:4; }

/* Results */
#resultBtns{ display:none; margin:26px auto 0; max-width:960px }
#resultBtns .row{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center }
.btn{ padding:14px 22px; border:1px solid #333; background:#fff; border-radius:12px; font-family:'Inknut Antiqua',serif;
  cursor:pointer; transition:.2s; font-size:20px; min-width:220px; color:black; }
.btn:hover{ background:#536340; color:#fff }  /* green hover desktop */
@media (max-width:600px){ .btn{ width:100%; color:black } }

#backPortfolio{ display:none; margin:16px auto 40px; text-decoration:none; color:#333; border:1px solid #333; border-radius:10px;
  padding:10px 16px; font-family:'Inknut Antiqua',serif; font-size:18px; }
#backPortfolio.show{ display:inline-block }
#backPortfolio:hover{ background:#536340; color:#fff }
</style>
</head>
<body>
<!-- Music -->
<audio id="bgm" preload="auto" loop></audio>
<div id="overlay"></div>
<div id="tapHint">Click or press space to continue</div>
<section id="storySection"><div id="storyWrap"><div id="story"></div></div></section>

<section id="arsenalSection">
  <h2>Choose from your Arsenal</h2>
  <div id="arsenalGrid">
    <button class="asset" data-item="sword"><img class="thumb" src="play/SWORD.svg" alt=""></button>
    <button class="asset" data-item="gun"><img class="thumb" src="play/REVOLVER.svg" alt=""></button>
    <button class="asset" data-item="holy"><img class="thumb" src="play/HOLY-WATER-GUN.svg" alt=""></button>
    <button class="asset" data-item="heart"><img class="thumb" src="play/HEART.svg" alt=""></button>
    <button class="asset" data-item="socks"><img class="thumb" src="play/SOCKS.svg" alt=""></button>
    <button class="asset" data-item="rose"><img class="thumb" src="play/ROSE.svg" alt=""></button>
  </div>
</section>

<section id="cupStage">
  <h2 id="cupTitle">The Shuffle</h2>
  <div id="board"><div id="cupRow">
    <img id="flyingItem" alt="Chosen item">
    <div id="cup0" class="cup" data-pos="0"><img src="play/CUP.svg" alt=""></div>
    <div id="cup1" class="cup" data-pos="1"><img src="play/CUP.svg" alt=""></div>
    <div id="cup2" class="cup" data-pos="2"><img src="play/CUP.svg" alt=""></div>
  </div></div>
</section>

<section id="resultBtns">
  <div class="row">
    <button id="again" class="btn">Replay current story</button>
    <button id="toDragon" class="btn">Bureaucratic Dragon</button>
    <button id="toLibrary" class="btn">Flooded Library</button>
  </div>
</section>
<a id="backPortfolio" href="index.html">Back to portfolio</a>

<script>
/* Helpers */
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const overlay=$('#overlay'), tapHint=$('#tapHint');
let currentScenario='kitchen', selectedItem=null;
let cupPos=[0,1,2], cupContents={}, shuffled=false, busy=false;

/* Simple overlay lines */
async function playLines(lines){ overlay.innerHTML=''; overlay.style.display='block';
 for(let l of lines){ const el=document.createElement('div'); el.className='overlayLine'; el.innerHTML=l; overlay.appendChild(el);
   await wait(30); el.classList.add('show'); await new Promise(res=>overlay.addEventListener('click',res,{once:true}));
   el.classList.add('hide'); await wait(420); }
 overlay.style.display='none'; }

/* Arsenal click */
$('#arsenalGrid').addEventListener('click', async e=>{
 const btn=e.target.closest('.asset'); if(!btn||busy)return;
 selectedItem=btn.dataset.item;
 await playLines(["Didn’t think it would be that easy now, did you?"]);
 proceedToCups();
});

/* Shuffle fix */
function swapCups(a,b){ const pa=cupPos[a], pb=cupPos[b]; cupPos[a]=pb; cupPos[b]=pa;
 $('#cup'+a).dataset.pos=pb; $('#cup'+b).dataset.pos=pa; }
function randomSwap(){ let a=Math.floor(Math.random()*3); let b=(a+1+Math.floor(Math.random()*2))%3; swapCups(a,b); }

async function proceedToCups(){
 $('#arsenalSection').style.display='none'; $('#cupStage').style.display='block';
 shuffled=false;
 const swaps=6+Math.floor(Math.random()*3);
 for(let i=0;i<swaps;i++){ await wait(700); randomSwap(); }
 shuffled=true;
 await playLines(["Well, well, my dear Traveller… where did it go? Pick your cup."]);
}

/* Outcome + final message */
async function tellOutcome(){
 await playLines(["Life always works out. Even when the situation doesn't unfold the way you thought it would."]);
 $('#resultBtns').style.display='block'; $('#backPortfolio').classList.add('show');
}

/* Cup pick */
['#cup0','#cup1','#cup2'].forEach((s,idx)=>$(s).onclick=async()=>{
 if(!shuffled||busy)return; busy=true;
 await playLines(["Your choice dives into the dance."]);
 await tellOutcome();
});

/* Boot */
playLines(["Welcome, let’s play a game, shall we?"]).then(()=> $('#arsenalSection').style.display='block');
</script>
</body>
</html>
