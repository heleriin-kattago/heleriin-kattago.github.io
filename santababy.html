<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jõululoos — Secret Santa</title>

<link rel="icon" type="image/svg+xml" href="santbaby/gift.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inknut+Antiqua:wght@400;700&family=Mansalva&display=swap" rel="stylesheet">

<style>
:root{
  --paper:#f9f9f9;
  --dark:#101A04;
  --ink:#1c1c1c;
  --accent:#2d5808;
  --ribbon:#f55252;
  --gold:#d6b35b;
  --gold2:#f6e6a5;
}
*{box-sizing:border-box}
body{
  background:var(--paper);
  color:var(--dark);
  margin:0;
  min-height:100svh;
  display:center;
  place-items:center;
  text-align:center;
  font-family:"Inknut Antiqua", serif;
}
main{ width:min(850px, 92vw); padding:24px 12px 48px; }
h1{ font-family:"Mansalva", cursive; margin:.2rem 0 .6rem; font-size:clamp(50px,5vw,46px) }
p{ margin:.2rem 0 1rem }

.inputRow{
  display:flex; gap:10px; justify-content:center; align-items:center; flex-wrap:wrap;
}
input[type="text"]{
  width:260px; padding:10px 14px; border:1px solid #cfcfcf; border-radius:12px;
  font-size:18px; text-align:center;
}
button{
  padding:10px 16px; border:none; border-radius:12px; cursor:pointer;
  font-family:"Inknut Antiqua", serif; font-size:18px; transition:.2s;
}
.primary{ background:var(--accent); color:#fff }
.primary:hover{ filter:brightness(1.08) }
.secondary{ background:#fff; color:#000; border:1px solid #333 }
.secondary:hover{ background:#f0f0f0 }

/* Gift */
#giftWrap{ margin:28px auto 0; width:200px; height:200px; position:relative; display:none; }
#giftWrap img{ width:100%; height:100%; display:block; }
.shake-soft{ animation:shake .4s ease-in-out 0s 3; }
.shake-hard{ animation:shakeHard .65s ease-in-out 0s 2; }
@keyframes shake{
  0%{transform:rotate(0)} 25%{transform:rotate(6deg)} 50%{transform:rotate(-6deg)}
  75%{transform:rotate(6deg)} 100%{transform:rotate(0)}
}
@keyframes shakeHard{
  0%{transform:translateX(0) rotate(0)}
  15%{transform:translateX(-16px) rotate(-8deg)}
  30%{transform:translateX(16px) rotate(8deg)}
  45%{transform:translateX(-14px) rotate(-6deg)}
  60%{transform:translateX(14px) rotate(6deg)}
  75%{transform:translateX(-10px) rotate(-4deg)}
  100%{transform:translateX(0) rotate(0)}
}

/* Scroll overlay */
#scrollOverlay{
  position:fixed; inset:0; display:none; align-items:center; justify-content:center;
  z-index:80; pointer-events:none;
}
.scrollCard{
  position:relative;
  width:min(800px, 86vw);
  padding:48px 28px;
  background:linear-gradient(180deg, #f8f0df, #f1e5cc 60%, #eadbb7);
  border-radius:18px;
  box-shadow:
    0 18px 60px rgba(0,0,0,.25),
    0 0 0 2px rgba(120,80,20,.15) inset,
    0 0 80px 20px rgba(246, 230, 165, .4);
  transform:scale(.85) translateY(18px);
  opacity:0;
  transition:transform .7s cubic-bezier(.2,.8,.2,1), opacity .7s ease;
}
.scrollCard.show{
  transform:scale(1) translateY(0);
  opacity:1;
}
.scrollTop, .scrollBot{
  position:absolute; left:50%; transform:translateX(-50%);
  width:94%; height:20px; border-radius:10px;
  background:linear-gradient(180deg, #e0cfa8, #c6a86a);
  box-shadow:inset 0 4px 8px rgba(0,0,0,.15);
}
.scrollTop{ top:-12px }
.scrollBot{ bottom:-12px }
.glow{
  position:absolute; inset:-10%; border-radius:24px;
  box-shadow:0 0 80px 20px rgba(246, 230, 165, .45), 0 0 140px 50px rgba(214,179,91,.25);
  pointer-events:none;
}
#recipient{
  font-size:clamp(28px, 6vw, 52px);
  font-weight:700; color:#2a200f; letter-spacing:.5px;
  text-shadow:0 1px 0 #fff8, 0 2px 0 #fff4;
}

/* Result + quit */
#resultNote{ margin-top:12px; opacity:.85 }
#quit{ display:none; margin-top:16px; background:var(--ribbon); color:#fff }
#quit:hover{ filter:brightness(1.08) }

/* Admin/Test bar */
#adminBar{
  position:fixed; left:50%; bottom:14px; transform:translateX(-50%);
  display:none; gap:8px; z-index:120; background:#fff; border:1px solid #333; border-radius:12px; padding:8px;
}
#adminBar input{ width:160px; padding:8px; border:1px solid #999; border-radius:10px; font-size:14px; }
#adminBar button{ font-size:14px; padding:8px 10px }
</style>
</head>

<body>
<main>
  <h1>Jõululoos</h1>
  <p id="prompt">Sisesta oma nimi, et osaleda</p>

  <div class="inputRow" id="inputRow">
    <input id="nameInput" type="text" placeholder="heleriin" />
    <button id="enterBtn" class="primary">Enter</button>
  </div>

  <div id="giftWrap">
    <img id="giftImg" src="santbaby/gift.svg" alt="gift">
  </div>

  <p id="resultNote"></p>
  <button id="quit" class="secondary">Lõpeta</button>
</main>

<!-- CSS Scroll overlay -->
<div id="scrollOverlay" aria-hidden="true">
  <div class="scrollCard" id="scrollCard">
    <div class="scrollTop"></div>
    <div class="glow"></div>
    <div id="recipient">—</div>
    <div class="scrollBot"></div>
  </div>
</div>

<!-- Admin/Test -->
<div id="adminBar">
  <button id="resetAll" class="secondary">Reset All</button>
  <input id="resetOneName" placeholder="name to reset" />
  <button id="resetOneBtn" class="secondary">Reset One</button>
</div>

<script type="module">
/* ===== CONFIG ===== */
const NAMES = ["heleriin","triin","helina","joonas","kaara","kaspar","nicole","kairi","melany"];
const STORE_KEY = "joululoos_draws_v1";

/* ==== FIREBASE for status tracking ==== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getFirestore, doc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

// 🔧 Your Firebase config
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID"
};
const EVENT_ID = "joululoos2025";
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const norm = s => s.trim().toLowerCase().replace(/\s+/g," ");
async function markEntered(name){
  const ref = doc(db,"events",EVENT_ID,"status",norm(name));
  await setDoc(ref,{entered:true,enteredAt:Date.now()},{merge:true});
}
async function markRevealed(name){
  const ref = doc(db,"events",EVENT_ID,"status",norm(name));
  await updateDoc(ref,{revealed:true,revealedAt:Date.now()});
}

/* ===== Local storage logic (unchanged) ===== */
const load = () => JSON.parse(localStorage.getItem(STORE_KEY) || "{}");
const save = obj => localStorage.setItem(STORE_KEY, JSON.stringify(obj));
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r=>setTimeout(r,ms));
function normalizeName(s){ return (s||"").trim().toLowerCase().replace(/\s+/g," "); }
function getRemainingFor(draws, me){
  const taken = new Set(Object.values(draws));
  return NAMES.filter(n => n !== me && !taken.has(n));
}
function showAdminIfNeeded(){
  const params = new URLSearchParams(location.search);
  if(params.get("reset")==="1"){ localStorage.removeItem(STORE_KEY); location.replace(location.pathname); return; }
  if(params.get("admin")==="1"){ document.getElementById("adminBar").style.display="flex"; }
}
showAdminIfNeeded();

/* ===== Elements ===== */
const promptEl=$("#prompt"), inputRow=$("#inputRow"), nameInput=$("#nameInput"),
enterBtn=$("#enterBtn"), giftWrap=$("#giftWrap"), giftImg=$("#giftImg"),
resultNote=$("#resultNote"), quitBtn=$("#quit"), scrollOverlay=$("#scrollOverlay"),
scrollCard=$("#scrollCard"), recipientEl=$("#recipient");

/* ===== Flow ===== */
enterBtn.addEventListener("click", async ()=>{
  const me=normalizeName(nameInput.value);
  if(!NAMES.includes(me)){ alert("Name not recognized. Use: "+NAMES.join(", ")); return; }

  await markEntered(me); // 👈 record who entered

  const draws=load();
  inputRow.style.display="none";
  giftWrap.style.display="block";
  promptEl.textContent = draws[me] ? "Sa oled juba avanud oma kingituse 🎁" : "Kliki kingile, et näha kellele teed kingituse!";
  giftImg.classList.add("shake-soft");

  if(draws[me]){ await reveal(draws[me]); return; }

  giftWrap.onclick=async()=>{
    giftWrap.onclick=null;
    const remaining=getRemainingFor(draws,me);
    if(remaining.length===0){ alert("Kõik nimed on juba võetud."); return; }
    giftImg.classList.remove("shake-soft");
    giftImg.classList.add("shake-hard");
    await sleep(900);
    const choice=remaining[Math.floor(Math.random()*remaining.length)];
    draws[me]=choice; save(draws);
    await markRevealed(me); // 👈 record who revealed
    await reveal(choice);
  };
});
quitBtn.onclick=()=>location.reload();

async function reveal(name){
  giftWrap.style.display="none";
  scrollOverlay.style.display="flex";
  await sleep(10);
  recipientEl.textContent=name;
  scrollCard.classList.add("show");
  resultNote.textContent="Võta ekraanipilt või kirjuta nimi üles!";
  quitBtn.style.display="inline-block";
}

/* ===== Admin/Test ===== */
document.getElementById("resetAll").onclick=()=>{
  if(confirm("Kustutada kõik loosimised selles seadmes?")){
    localStorage.removeItem(STORE_KEY); alert("Kustutatud."); location.reload();
  }
};
document.getElementById("resetOneBtn").onclick=()=>{
  const n=normalizeName(document.getElementById("resetOneName").value);
  if(!n)return;
  const draws=load(); delete draws[n]; save(draws);
  alert(`Lähtestatud: "${n}"`);
};
</script>
</body>
</html>
